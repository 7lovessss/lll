let current = 0;
let answers = Array(questions.length).fill(null);
let score = {a:0,b:0,c:0,d:0,e:0,f:0,g:0,h:0,i:0,j:0};

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function startQuiz(){
  current=0;
  answers.fill(null);
  score={a:0,b:0,c:0,d:0,e:0,f:0,g:0,h:0,i:0,j:0};
  renderQ();
  showPage('page-quiz');
}
function renderQ(){
  const q = questions[current];
  document.getElementById('qnum').innerText = `第 ${current+1} / ${questions.length} 题`;
  document.getElementById('qtext').innerText = q.q;
  const wrap = document.getElementById('opts-wrap');
  wrap.innerHTML = '';
  q.o.forEach((opt,idx)=>{
    const div = document.createElement('div');
    div.className = 'opt' + (answers[current]===idx ? ' selected':'');
    div.innerText = opt.t;
    div.onclick = ()=>{
      answers[current]=idx;
      renderQ();
    }
    wrap.appendChild(div);
  })
  document.getElementById('bar').style.width = ((current+1)/questions.length*100)+'%';
  document.getElementById('prev').style.visibility = current===0 ? 'hidden':'visible';
}
function prevQuestion(){
  if(current>0){current--;renderQ();}
}
function nextQuestion(){
  if(answers[current]==null){alert("请选择一个答案哦");return;}
  if(current < questions.length-1){
    current++;renderQ();
  }else{
    calcResult();
  }
}
function calcResult(){
  score={a:0,b:0,c:0,d:0,e:0,f:0,g:0,h:0,i:0,j:0};
  for(let i=0;i<questions.length;i++){
    const selIdx = answers[i];
    const tag = questions[i].o[selIdx].tag;
    score[tag]++;
  }
  let maxTag = 'a';
  let maxVal = 0;
  for(let k in score){
    if(score[k]>maxVal){maxVal=score[k];maxTag=k;}
  }
  const r = resultMap[maxTag];
  document.getElementById('res-title').innerText = r.title;
  document.getElementById('res-desc').innerText = r.desc;
  showPage('page-result');
}
function resetAll(){
  showPage('page-home');
}
